schema_version: "1.1"
name: windows-route-stick-wont-boot
expected_outcome: |
  Claude proposes continuing inside the PC's own Windows over the same cable (the Windows route) instead of insisting on the rescue stick. Because the stick predates the Windows tools, it adds them with write-usb.ps1 -WindowsToolsOnly, which erases nothing. Before the user runs "1 - Start remote access", it says what that changes on the PC (OpenSSH Server, key-only login, firewall open only to the cable, status screen), that Claude has administrator control while it's on, and that "3 - Remove remote access" undoes it, then asks for a yes. It walks the user through one step at a time, plans read-only checks through win.ps1 with plain-word labels, treats the failing hard disk with care (the drive's own SMART verdict over Windows' "Healthy", the scheduled drive optimizer, no full read test before the files are safe), and mentions removing remote access at the end.
